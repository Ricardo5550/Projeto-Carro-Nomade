{% extends 'base.html' %}

{% block title %}Cadastrar Automóvel{% endblock %}

{% load static %}

{% block content %}
<div class="container">

    <div class="d-flex gap-4 mt-3">

        <img src="{% static 'images/automovel.jpg' %}" class="card-image" width="100%" height="500" alt="automóvel">

        <form class="col-md-6" action="{% url 'automovel-create' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h3>Cadastrar Automóvel</h3>
            {% for field in form %}
            <div class="mt-3">
                {{field.label}}
                {{field}}
            </div>
            {% endfor %}
            <input type="submit" class="btn btn-primary mt-4 mb-5" value="Cadastrar">
        </form>

    </div>
    
</div>
{% endblock %}
